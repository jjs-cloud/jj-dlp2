
[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Enable GitHub artifact attestations for release artifacts
github-attestations = true
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Extra files placed inside each archive (the bundled yt-dlp binaries)
include = ["bin"]
# Write a .sha256 file next to every archive; the in-app updater verifies it
checksum = "sha256"
# Archive formats the in-app updater expects
unix-archive = ".tar.gz"
windows-archive = ".zip"
